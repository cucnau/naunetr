
<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Edit</title>
    <link rel="manifest" href="./manifest.json">
    
    <!-- Android / Chrome -->
    <meta name="theme-color" content="#4E342E">
    <meta name="mobile-web-app-capable" content="yes">
    
    <!-- iOS / Safari PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Edit">
    
    <!-- Icons -->
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/1828/1828911.png">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1828/1828911.png">

    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&family=Pacifico&family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+Vietnamese:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/index.css">
    <style>
        body {
            font-family: 'Noto Sans Vietnamese', sans-serif;
            overscroll-behavior-y: none;
        }
        .font-serif-sc {
            font-family: 'Noto Serif SC', serif;
        }
        /* Ẩn thanh cuộn toàn bộ trang nhưng vẫn cuộn bình thường */
        * {
            -ms-overflow-style: none; /* IE and Edge */
            scrollbar-width: none; /* Firefox */
        }
        *::-webkit-scrollbar {
            display: none; /* Chrome, Safari, Opera */
            width: 0;
            height: 0;
        }

        /* RESET BẢNG */
        table {
            border-collapse: collapse;
            border-spacing: 0;
        }

    </style>
    <!-- Polyfill process để tránh lỗi crash khi chạy local -->
    <script>
      window.process = window.process || { env: {} };
    </script>
</head>
  <body class="bg-[#F5E6D3] text-[#3E2723] min-h-screen" translate="no">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          const basePath = window.location.pathname.endsWith('/') 
            ? window.location.pathname 
            : window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/') + 1);
          const swPath = basePath + 'sw.js';
          navigator.serviceWorker.register(swPath, { scope: basePath }).catch(err => {
            console.log('ServiceWorker registration failed: ', err);
          });
        });
      }
    </script>
  </body>
</html>
